let L='fr',S={g1:'?',g2:'?',rel:'?',par:['?','?','?','?'],n:3,quiz:null};
const REL={none:[0,0],c1:[1/8,1/16],c2:[1/32,1/64],un:[1/4,1/8],dc1:[1/4,1/8]},RELK=['?','none','c1','c2','un','dc1'];
/* r = part de gènes partagée par les ancêtres communs ; si l’un porte une variante, l’autre la porte avec la probabilité r + (1 − r) × c (c = fréquence des porteurs) ; risque d’enfant atteint = ce nombre / 4 */
const kinRisk=(r,c)=>(r+(1-r)*c)/4,CFREQ=.2,CRARE=.01;
const pp=v=>{const x=v*100,n=(x<1?x.toFixed(2):x<20?x.toFixed(1):String(Math.round(x))).replace(/\.0$/,'');return (L==='fr'?n.replace('.',','):n)+' %'};
const $=s=>document.querySelector(s),t=()=>T[L];
const opts=sel=>`<option value="?">${t().unk}</option>`+GEN.map(g=>`<option value="${g}"${g===sel?' selected':''}>${disp(g)} · ${t().geno[cat(g)]}</option>`).join('');
const pct=v=>Math.round(v*100);
const both=()=>S.g1!=='?'&&S.g2!=='?';
const need=()=>`<div class="empty">${t().needBoth}</div>`;

function render(){
  speechSynthesis.cancel();
  document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t()[e.dataset.t]);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  $('#g1').innerHTML=opts(S.g1);$('#g2').innerHTML=opts(S.g2);$('#rel').innerHTML=t().rel.map((x,i)=>`<option value="${RELK[i]}"${RELK[i]===S.rel?' selected':''}>${x}</option>`).join('');
  const act=document.querySelector('.tabs [aria-selected=true]'),cur=act?+act.dataset.i:0;
  $('#tabs').innerHTML=t().tabs.map((x,i)=>`<button role="tab" data-i="${i}" aria-selected="${i===cur}">${x}</button>`).join('');
  $('#pg').style.width=((both()?1:0)+(S.quiz!==null?1:0)+(S.fiche?1:0))/3*100+'%';
  kin();expl();fam();cal();nxt();ui();
}

function kin(){
  const e=$('#kin'),k=REL[S.rel];let h=`<div class="card"><h2>${t().kinT}</h2><p class="mute">${t().kinI}</p>`;
  if(!k){e.innerHTML=h+`<div class="empty">${t().kinNo}</div></div>`;return}
  const [r]=k,u=c=>kinRisk(0,c),y=c=>kinRisk(r,c),ch=(v,l,bg)=>`<div class="chip" style="background:var(${bg})"><b>${pp(v)}</b><small>${l}</small></div>`;
  h+=`<p>${t().kinWhy}</p>`;
  if(r>0)h+=`<div class="note">${t().kinShare(r)}</div>`;
  h+=`<h3>${t().kinQ}</h3><p class="mute">${t().kinC}</p><div class="kin">${ch(u(CFREQ),t().kinU,'--c-non')}${ch(y(CFREQ),t().kinY+' · '+t().relS[RELK.indexOf(S.rel)],'--c-por')}</div>
  <p class="mute">${t().kinR}</p><div class="kin">${ch(u(CRARE),t().kinU,'--c-non')}${ch(y(CRARE),t().kinY+' · '+t().relS[RELK.indexOf(S.rel)],'--c-por')}</div>
  <p class="mute">${t().kinLim}</p>`;
  if(both())h+=`<div class="note ok">${t().kinKnown}</div>`;
  if(r>0)h+=`<h3>${t().kinSteps}</h3><ul>${t().kinList.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  e.innerHTML=h+`<p class="mute">${t().kinNoRec}</p></div>`;
}

function expl(){
  const e=$('#expl');if(!both()){e.innerHTML=`<div class="card">${need()}</div>`;return}
  const p=probs(S.g1,S.g2),a=S.g1.split(''),b=S.g2.split('');
  const chips=CATS.filter(c=>p[c]>0).map(c=>`<div class="chip" style="background:var(${CV[c]})"><b>${pct(p[c])} %</b>${t().cs[c]}</div>`).join('');
  let dots='';CATS.forEach(c=>{for(let i=0;i<Math.round(p[c]*20);i++)dots+=`<div class="dot${c==='dre'?' s':''}" style="background:var(${CV[c]})"></div>`});
  const leg=CATS.filter(c=>p[c]>0).map(c=>`<span><i style="background:var(${CV[c]})"></i>${t().cs[c]}</span>`).join('');
  const grid=`<table class="p"><tr><th></th>${b.map(x=>`<th>${disp(x)}</th>`).join('')}</tr>${a.map(x=>`<tr><th>${disp(x)}</th>${b.map(y=>{const c=cat(x+y);return`<td class="${CL[c]}">${disp(x+y)}<small>${t().geno[c]}</small></td>`}).join('')}</tr>`).join('')}</table>`;
  const detail=CATS.filter(c=>p[c]>0).map(c=>`${t().cs[c].toLowerCase()} : ${pct(p[c])} %`).join(', ');
  const exQ=t().exQ;
  e.innerHTML=`<div class="card"><h2>${t().each}</h2><div class="chips">${chips}</div>
  <h3>${t().dotsT}</h3><div class="dots">${dots}</div><div class="legend">${leg}</div><p class="mute">${t().dotsN}</p>
  <h3>${t().punT}</h3><p class="mute">${t().punC}</p>${grid}</div>
  <div class="card"><h2>${t().aiT}</h2><p>${t().exTxt(detail)}</p><ul>${t().keys.map(k=>`<li>${k}</li>`).join('')}</ul>
  <h3>${t().aiQ}</h3><ul>${exQ.map(q=>`<li>${q}</li>`).join('')}</ul><button class="btn alt" id="spk">${t().listen}</button> <button class="btn" id="stp">${t().stop}</button></div>`;
  $('#spk').onclick=()=>{const u=new SpeechSynthesisUtterance(t().exTxt(detail)+' '+t().keys.join(' '));u.lang=L==='fr'?'fr-FR':'en-US';speechSynthesis.cancel();speechSynthesis.speak(u)};
  $('#stp').onclick=()=>speechSynthesis.cancel();
}

function box(x,y,w,h,title,sub,c){return`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" class="${c}"/><text x="${x+w/2}" y="${y+22}" text-anchor="middle" font-size="12" fill="#1b1030" font-weight="700">${title}</text><text x="${x+w/2}" y="${y+h-14}" text-anchor="middle" font-size="12" fill="#1b1030">${sub}</text></g>`}
function fam(){
  const e=$('#fam');let h=`<h2>${t().famT}</h2><p class="mute">${t().famI}</p>`;
  if(!both()){e.innerHTML=h+need();return}
  h+=`<div class="pair">`+t().roles.map((r,i)=>`<div><label for="p${i}">${r}</label><select id="p${i}" data-p="${i}">${opts(S.par[i])}</select></div>`).join('')+`</div>`;
  const pos=[[10,160],[180,160],[372,160],[542,160]];let s='<svg viewBox="0 0 700 360" width="100%" role="img" aria-label="'+t().famT+'"><style>.cNP{fill:#bdeedd}.cPO{fill:#fbe2a6}.cDR{fill:#ffc3b5}.cAU{fill:#d8cdfa}.cUN{fill:#e3e0ea}</style><g stroke="#9a90b3" stroke-width="2" fill="none"><path d="M85 72V108H185V120M255 72V108H185"/><path d="M457 72V108H525V120M627 72V108H525"/></g>';
  s='<svg viewBox="0 0 700 360" width="100%" role="img" aria-label="'+t().famT+'"><style>.cNP{fill:#bdeedd}.cPO{fill:#fbe2a6}.cDR{fill:#ffc3b5}.cAU{fill:#d8cdfa}.cUN{fill:#e3e0ea}</style><g stroke="#9a90b3" stroke-width="2" fill="none"><path d="M85 76V98H175V118"/><path d="M265 76V98H175V118"/><path d="M457 76V98H525V118"/><path d="M627 76V98H525V118"/><path d="M270 168H430" stroke-dasharray="5 4"/><path d="M350 168V200"/></g>';
  S.par.forEach((g,i)=>{const x=[10,180,372,542][i];s+=box(x,6,150,70,t().roles[i],g==='?'?t().unkTree:disp(g)+' · '+t().geno[cat(g)],g==='?'?'cUN':CL[cat(g)])});
  s+=box(100,118,150,56,t().pa,disp(S.g1)+' · '+t().geno[cat(S.g1)],CL[cat(S.g1)])+box(450,118,150,56,t().pb,disp(S.g2)+' · '+t().geno[cat(S.g2)],CL[cat(S.g2)]);
  const p=probs(S.g1,S.g2),cs=CATS.filter(c=>p[c]>0),w=150,gap=14,tw=cs.length*w+(cs.length-1)*gap,x0=350-tw/2;
  cs.forEach((c,i)=>{const x=x0+i*(w+gap);s+=`<path d="M350 200H${x+w/2}V250" stroke="#9a90b3" stroke-width="2" fill="none"/>`+box(x,250,w,70,t().child,t().geno[c]+' · '+pct(p[c])+' %',CL[c])});
  s+='</svg>';
  const miss=S.par.map((g,i)=>g==='?'?t().roles[i]:null).filter(Boolean);
  e.innerHTML=h+s+(miss.length?`<div class="note warn">${t().famU(miss.join(', '))}</div>`:'')+(REL[S.rel]&&REL[S.rel][0]>0?`<div class="note">${t().famK}</div>`:'');
  e.querySelectorAll('[data-p]').forEach(sel=>sel.onchange=()=>{S.par[+sel.dataset.p]=sel.value;fam()});
}

function cal(){
  const e=$('#cal');let h=`<h2>${t().calT}</h2><p class="mute">${t().calI}</p>`;
  if(!both()){e.innerHTML=h+need();return}
  const sr=serie(S.g1,S.g2);
  if(sr[0]===0)h+=`<div class="note ok">${t().calNone}</div>`;
  else h+=`<label for="rg" style="margin-top:14px">${t().calS} : <b id="nv">${S.n}</b></label><input id="rg" type="range" min="1" max="5" value="${S.n}">
  <div class="mute">${t().calM}</div><div class="big" id="bv">${pct(sr[S.n-1])} %</div>
  <div class="bars">${sr.map((v,i)=>`<div class="bar${i<S.n?' on':''}" style="height:${v*100}%"><span>${pct(v)}%</span></div>`).join('')}</div><div class="bl">${sr.map((_,i)=>`<div>${i+1}</div>`).join('')}</div>`;
  h+=`<p class="mute">${t().calInd}</p><h3>${t().road}</h3><ol class="tl">${t().tl.map(x=>`<li><b>${x[0]}</b>${x[1]}</li>`).join('')}</ol>`;
  e.innerHTML=h;const r=$('#rg');if(r)r.oninput=()=>{S.n=+r.value;$('#nv').textContent=S.n;$('#bv').textContent=pct(sr[S.n-1])+' %';document.querySelectorAll('.bar').forEach((b,i)=>b.classList.toggle('on',i<S.n))};
}

function pdfFile(title,meta,blocks,bet){
  const W=595,H=842,M=50,CW=W-2*M,pages=[];let cur,y;
  const fix=x=>x.replace(/(?<=[A-Za-zβ])β/g,'-'+bet).replace(/β/g,bet);
  const map={'’':0x92,'‘':0x91,'“':0x93,'”':0x94,'…':0x85,'–':0x96,'—':0x97,'€':0x80,'•':0x95};
  const enc=x=>[...fix(x)].map(c=>{let n=map[c]??c.charCodeAt(0);if(n>255)n=63;return(n===40||n===41||n===92)?'\\'+c:(n<32||n>126)?'\\'+n.toString(8).padStart(3,'0'):String.fromCharCode(n)}).join('');
  const cw=(c,b)=>(/[ijl.,:;'!|]/.test(c)?.26:/[ft()\-\/]/.test(c)?.33:/[mwMW]/.test(c)?.82:/[A-Z]/.test(c)?.68:/\d/.test(c)?.556:.54)*(b?1.07:1);
  const wd=(x,sz,b)=>[...fix(x)].reduce((a,c)=>a+cw(c,b)*sz,0);
  const wrap=(x,sz,w,b)=>{const o=[];let ln='';for(const word of x.split(' ')){const cand=ln?ln+' '+word:word;if(ln&&wd(cand,sz,b)>w){o.push(ln);ln=word}else ln=cand}if(ln)o.push(ln);return o};
  const C={ink:'0.23 0.04 0.14',br:'0.86 0.15 0.47',mu:'0.42 0.38 0.50',wh:'1 1 1',lt:'0.99 0.85 0.93'};
  const txt=(x,xx,yy,f,sz,col)=>cur.push(`BT /F${f} ${sz} Tf ${C[col]} rg ${xx} ${yy} Td (${enc(x)}) Tj ET`);
  const page=()=>{cur=[];pages.push(cur);y=H-60};
  const need=h=>{if(y-h<60)page()};
  page();
  cur.push(`0.51 0.09 0.26 rg 0 ${H-100} ${W} 100 re f 0.96 0.45 0.71 rg 0 ${H-100} 14 100 re f`);
  txt(title,M,H-52,2,17,'wh');txt(meta,M,H-72,1,10,'lt');y=H-135;
  for(const k of blocks){
    if(k.h){need(40);y-=8;txt(k.h,M,y,2,13,'br');y-=20}
    if(k.p)for(const l of wrap(k.p,10.5,CW,0)){need(16);txt(l,M,y,k.i?3:(k.s?2:1),10.5,k.i?'mu':'ink');y-=15}
    for(const b of k.b||[]){const ls=wrap(b,10.5,CW-18,0);need(15*ls.length);txt('•',M+4,y,1,10.5,'br');ls.forEach(l=>{txt(l,M+18,y,1,10.5,'ink');y-=15});y-=2}
    y-=4}
  const o=['','<< /Type /Catalog /Pages 2 0 R >>','','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>'];
  const kids=[];
  pages.forEach((p,i)=>{const s=p.join('\n'),ci=o.length,pi=ci+1;o.push(`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);o.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Contents ${ci} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> >>`);kids.push(pi+' 0 R')});
  o[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
  let out='%PDF-1.4\n';const off=[];
  for(let i=1;i<o.length;i++){off.push(out.length);out+=`${i} 0 obj\n${o[i]}\nendobj\n`}
  const xr=out.length;out+=`xref\n0 ${o.length}\n0000000000 65535 f \n`+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${o.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  return new Blob([Uint8Array.from(out,c=>c.charCodeAt(0))],{type:'application/pdf'});
}

function ficheData(){
  const f=t().fiche,sr=serie(S.g1,S.g2),p=probs(S.g1,S.g2);
  const blocks=[{h:f.res,b:[`${t().pa} : ${disp(S.g1)}`,`${t().pb} : ${disp(S.g2)}`]},
    {h:f.fam,b:S.par.map((g,i)=>`${t().roles[i]} : ${g==='?'?f.unk:disp(g)}`)},
    {h:f.risk,b:CATS.filter(c=>p[c]>0).map(c=>`${t().cs[c]} : ${pct(p[c])} %`)}];
  if(sr[0]>0)blocks.push({h:f.multi,b:sr.map((v,i)=>`${i+1} ${f.preg} : ${pct(v)} %`)});
  if(REL[S.rel])blocks.splice(1,0,{h:f.kin,b:[t().relS[RELK.indexOf(S.rel)]].concat(REL[S.rel][0]>0?[f.kinN]:[])});
  blocks.push({p:counsel(S.g1,S.g2)?t().cYes:t().cNo,s:1},{h:f.qs,b:t().qs},{p:t().disc,i:1});
  return{title:f.title,meta:f.meta+new Date().toLocaleString(L==='fr'?'fr-FR':'en-GB'),blocks};
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();S.fiche=1;$('#pg').style.width=((both()?1:0)+(S.quiz!==null?1:0)+1)/3*100+'%'}
function fiche(){const d=ficheData();save(pdfFile(d.title,d.meta,d.blocks,L==='fr'?'bêta':'beta'),'fiche_consultation.pdf')}

function nxt(){
  const e=$('#next');let h=`<h2>${t().nextT}</h2>`;
  h+=both()?`<div class="note ${counsel(S.g1,S.g2)?'warn':'ok'}">${counsel(S.g1,S.g2)?t().cYes:t().cNo}</div>`:need();
  h+=`<h3>${t().who}</h3><p>${t().whoB}</p><details><summary>${t().qT}</summary><ul>${t().qs.map(q=>`<li>${q}</li>`).join('')}</ul></details><p class="mute">${t().dir}</p>
  <h3>${t().fT}</h3><p class="mute">${t().fI}</p><button class="btn" id="fb" ${both()?'':'disabled'}>${t().fB}</button>
  <h3>${t().quizT}</h3>`+t().quiz.map((q,i)=>`<div class="q"><label>${q[0]}</label><div class="o">${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div></div>`).join('')+
  `<button class="btn alt" id="qb">${t().quizB}</button> <b id="qr">${S.quiz!==null?t().quizR(S.quiz):''}</b>`;
  e.innerHTML=h;$('#fb').onclick=fiche;
  $('#qb').onclick=()=>{let s=0,all=true;t().quiz.forEach((q,i)=>{const v=document.querySelector(`input[name=q${i}]:checked`);if(!v)all=false;else if(+v.value===q[2])s++});if(all){S.quiz=s;$('#qr').textContent=t().quizR(s);$('#pg').style.width=((both()?1:0)+1+(S.fiche?1:0))/3*100+'%'}};
}

document.addEventListener('click',e=>{
  const tb=e.target.closest('.tabs button');
  if(tb){speechSynthesis.cancel();document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b===tb));document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i===+tb.dataset.i))}
  const lb=e.target.closest('.lang button');if(lb){L=lb.dataset.l;render()}
});
$('#g1').onchange=e=>{S.g1=e.target.value;render()};
$('#g2').onchange=e=>{S.g2=e.target.value;render()};
$('#rel').onchange=e=>{S.rel=e.target.value;render()};

/* ===== Assistant : cadre strict, réponses préparées + IA optionnelle ===== */
const AI_ENDPOINT='https://assistant.mariejunior564.workers.dev'; // ← collez ici l'adresse de votre Worker (voir worker.js). Vide = réponses préparées seules.
const A={fr:{open:'💬 Assistant',title:'Assistant',m0:'Réponses préparées',m1:'IA encadrée',ph:'Votre question…',snd:'Envoyer',pd:'Informe, ne diagnostique pas et ne remplace pas un conseil génétique.',

out:'Je ne peux répondre qu’aux questions sur la consanguinité, la drépanocytose, vos résultats de porteur et la suite à donner. Essayez par exemple :',

risk:d=>`Pour ${d.c}, à chaque grossesse : ${d.d}. C’est une estimation, pas une certitude. Un conseiller en génétique peut l’interpréter pour votre situation.`,
k:{cons:'Quand deux personnes sont apparentées (par exemple cousins), elles ont reçu une partie de leurs gènes des mêmes ancêtres. Si l’une porte une variante rare d’un gène, l’autre a plus de chances de porter la même : le risque d’une maladie héréditaire pour l’enfant augmente alors, surtout pour les maladies rares. Ce n’est pas une certitude, et cela n’est la faute de personne. Voyez le bloc « Pourquoi le lien de parenté compte » (onglet Résultats). Un dépistage élargi des porteurs et un conseiller en génétique peuvent aider ; je ne recommande aucun choix familial.',carrier:'Être porteur (par exemple AS) signifie avoir un gène normal et un gène modifié. En général, on n’est pas malade : la maladie apparaît quand l’enfant reçoit un gène modifié de chaque parent.',
same:'Oui. Chaque grossesse est un nouveau tirage au sort : avoir eu un enfant non atteint ne change pas le risque de la suivante, et avoir eu un enfant atteint non plus.',
who:'Un conseiller en génétique ou un hématologue. Sinon, votre médecin traitant ou le service de santé de votre région peut vous orienter. Vous pouvez aussi télécharger la fiche (onglet Suite) et l’apporter à la consultation.',
test:'Seul un test sanguin fait par un laboratoire (par exemple une électrophorèse de l’hémoglobine) confirme un génotype. Demandez à un professionnel de santé où le faire.',
opt:'Cet outil ne recommande aucun choix : c’est une décision personnelle. Selon les pays et les centres, des options existent avant ou pendant une grossesse. Un conseiller en génétique ou un hématologue peut vous les présenter sans vous influencer.',
care:'Je ne peux pas parler de traitement ni de médicaments : cela relève d’un médecin qui connaît la personne. Un hématologue pourra vous répondre.',
priv:'Rien n’est enregistré ni envoyé : tout reste dans votre navigateur. Si l’assistant IA est activé, seuls les génotypes choisis et votre question sont envoyés, sans nom ni identifiant.',
how:'Choisissez les résultats des deux partenaires (onglet Résultats), ajoutez les proches (Famille), regardez le calendrier, puis téléchargez la fiche PDF dans l’onglet Suite.',
hi:'Bonjour ! Posez-moi une question sur vos résultats ou sur la suite à donner.'}},
en:{open:'💬 Assistant',title:'Assistant',m0:'Prepared answers',m1:'Guarded AI',ph:'Your question…',snd:'Send',pd:'Informs only: no diagnosis, not a substitute for genetic counselling.',
hi:'Hello! I answer questions about your carrier results, the risks for children and what to do next.',
sug:['What is our risk?','What if we are cousins?','Is a carrier ill?','Who should we see?'],
out:'I can only answer questions about marriage between relatives, sickle cell disease, your carrier results and next steps. For example, try:',
urg:'For severe pain, fever, trouble breathing or any emergency, contact emergency services or a doctor right away. I cannot give medical advice.',
safe:'I would rather not answer that: only a health professional can advise on this. A genetic counsellor or a haematologist can help.',

risk:d=>`For ${d.c}, at each pregnancy: ${d.d}. This is an estimate, not a certainty. A genetic counsellor can interpret it for your situation.`,
k:{cons:'When two people are related (for example cousins), they received part of their genes from the same ancestors. If one carries a rare gene variant, the other is more likely to carry the same one: the risk of an inherited disease for the child then goes up, especially for rare conditions. It is not a certainty, and it is nobody’s fault. See the “Why being related matters” block (Results tab). Extended carrier screening and a genetic counsellor can help; I recommend no family choice.',carrier:'Being a carrier (for example AS) means having one normal gene and one changed gene. Usually the person is not ill: the disease appears when a child receives a changed gene from each parent.',
same:'Yes. Each pregnancy is a new draw: having had an unaffected child does not change the next risk, and neither does having had an affected one.',
who:'A genetic counsellor or a haematologist. Otherwise your family doctor or local health service can refer you. You can also download the sheet (Next tab) and bring it to the consultation.',
test:'Only a blood test done by a laboratory (for example haemoglobin electrophoresis) confirms a genotype. Ask a health professional where to have it done.',
opt:'This tool recommends no choice: it is a personal decision. Depending on country and centre, options exist before or during a pregnancy. A genetic counsellor or haematologist can present them without steering you.',
care:'I cannot discuss treatment or medicines: that is for a doctor who knows the person. A haematologist can answer you.',

hi:'Hello! Ask me about your results or next steps.'}}};
const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const INT=[['urg',/douleur|crise|fievre|urgence|respir|saign|hopital|pain|crisis|fever|emergency|breath|bleed|hospital/],
['opt',/avort|interromp|\bivg\b|prenatal|\bfiv\b|adopt|faut.il avoir|devons.nous|doit.on|should we|abort|\bivf\b|what should we do|que faire|choisir/],
['care',/traitement|medicament|soigner|guerir|hydroxy|treatment|\bcure\b|medic|drug/],
['same',/chaque grossesse|prochain|suivant|deuxieme|encore|same|next|each pregnancy|another/],
['cons',/consang|cousin|apparent|parente|liens? de sang|mariage (entre|dans)|related|relatives? marr|inbreed|marry (a )?(relative|cousin)|kin\b/],
['risk',/risque|probab|chance|pourcent|aura.t.il|\brisk|percent|odds|will (our|the) (child|baby)/],
['carrier',/porteur|trait|malade|different|carrier|\bill\b|sick|difference/],
['who',/consult|conseil|genetic|generaliste|medecin|docteur|qui voir|ou aller|counsel|doctor|who should|where/],
['test',/\btest|depist|electroph|confirm|analyse|screen|lab/],
['priv',/donnee|prive|enregistr|confidenti|data|privacy|saved|secret/],
['how',/comment|utiliser|fiche|pdf|mode d.emploi|how|sheet|use/],
['hi',/^(bonjour|salut|bonsoir|hello|hi|hey)\b/]];
function local(q){const n=norm(q),a=A[L];let k=(INT.find(i=>i[1].test(n))||[])[0];
  if(!k)return{k:'out',t:a.out};if(k==='urg')return{k:'urg',t:a.urg};
  if(k==='risk'){if(!both())return{k:'in',t:a.need};const p=probs(S.g1,S.g2);return{k:'in',t:a.risk({c:`${disp(S.g1)} × ${disp(S.g2)}`,d:CATS.filter(c=>p[c]>0).map(c=>`${T[L].cs[c].toLowerCase()} ${pct(p[c])} %`).join(', ')})}}
  return{k:'in',t:a.k[k]}}
let aiOn=!!AI_ENDPOINT,hist=[],aL=null,aiFail=false;
const bub=(c,x,u)=>{const d=document.createElement('div');d.className='msg '+c+(u?' urg':'');d.textContent=x;$('#am').appendChild(d);$('#am').scrollTop=1e9;return d};
function chips(){$('#as').innerHTML=A[L].sug.map(x=>`<button type="button">${x}</button>`).join('');$('#as').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent))}
function ui(){const a=A[L];$('#ab').textContent=a.open;$('#at').textContent=a.title;$('#amd').textContent=aiOn&&!aiFail?a.m1:a.m0;$('#aq').placeholder=a.ph;$('#asn').textContent=a.snd;$('#apd').textContent=a.pd;
  if(aL!==L){aL=L;hist=[];$('#am').innerHTML='';bub('b',a.hi);chips()}}
async function ask(q){q=q.trim().slice(0,400);if(!q)return;bub('u',q);$('#aq').value='';const l=local(q);let out=l;
  if(aiOn&&l.k!=='urg'){const w=bub('b','…');let tm;try{
    const r=await Promise.race([fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,g1:S.g1,g2:S.g2,rel:S.rel,lang:L,h:hist.slice(-4)})}),new Promise((_,rej)=>{tm=setTimeout(()=>rej(new Error('timeout')),30000)})]);
    const j=await r.json().catch(()=>({}));
    if(!r.ok||typeof j.answer!=='string'||!j.answer||j.answer.length>4000){console.warn('[Assistant] réponse inattendue du Worker',r.status,j);throw 0}
    out={k:j.kind==='urgent'?'urg':'in',t:j.answer};w.remove();aiFail=false}catch(e){console.warn('[Assistant] appel impossible (réseau, CORS ou délai dépassé)',e);w.remove();aiFail=true}finally{clearTimeout(tm)}ui()}
  bub('b',out.t,out.k==='urg');hist.push({q,a:out.t});if(out.k==='out')chips()}
$('#ab').onclick=()=>{const o=$('#ap').hidden;$('#ap').hidden=!o;$('#ab').setAttribute('aria-expanded',o);if(o)$('#aq').focus()};
$('#ax').onclick=()=>{$('#ap').hidden=true;$('#ab').setAttribute('aria-expanded',false);speechSynthesis.cancel()};
$('#af').onsubmit=e=>{e.preventDefault();ask($('#aq').value)};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ap').hidden)$('#ax').click()});
addEventListener('pagehide',()=>speechSynthesis.cancel());
render();
</script>
